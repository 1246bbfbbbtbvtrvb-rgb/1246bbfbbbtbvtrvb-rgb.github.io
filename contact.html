<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contact Us | Code Jharkhand</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="hero">

    <h1>Code Jharkhand</h1>

    <p>Contact Us 📩</p>

  </header>


  <nav>

    <a href="index.html">Home</a>

    <a href="about.html">About</a>

    <a href="privacy.html">Privacy Policy</a>

    <a href="contact.html">Contact</a>

  </nav>


  <main>

    <section class="card">

      <h2>Contact Us</h2>

      <p>
        Website ke content, coding lessons ya kisi
        technical problem ke baare mein contact kar sakte hain.
      </p>


      <form onsubmit="sendMessage(event)">

        <label>Name</label>

        <input
          type="text"
          id="name"
          placeholder="Your Name"
          required
        >


        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Your Email"
          required
        >


        <label>Message</label>

        <textarea
          id="userMessage"
          rows="6"
          placeholder="Your Message"
          required
        ></textarea>


        <button type="submit">
          Send Message
        </button>

      </form>


      <p id="status"></p>

    </section>

  </main>


  <footer>

    <p>© 2026 Code Jharkhand</p>

    <p>Learn Coding Free 🚀</p>

  </footer>


  <script>

    function sendMessage(event) {

      event.preventDefault();

      document.getElementById("status").innerText =
        "✅ Your message has been submitted.";

    }

  </script>

</body>

</html>
